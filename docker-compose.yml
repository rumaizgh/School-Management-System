services:

  db:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "
      sleep 10 &&
      python3 manage.py migrate_schemas &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "

volumes:
  postgres_data:

