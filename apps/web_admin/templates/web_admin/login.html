{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'web_admin/css/theme.css' %}">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-branding">
      <div class="login-branding-icon">🏫</div>
      <h2>School Admin Portal</h2>
      <p style="color: var(--color-text-muted); font-size: 0.85rem;">Sign in to access your school workspace</p>
    </div>

    <form id="loginForm">
      <div class="form-group" style="text-align: left;">
        <label for="email">Admin Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="admin@school.com" required autocomplete="email">
      </div>

      <div class="form-group" style="text-align: left;">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
        Sign In to Portal
      </button>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="{% static 'web_admin/js/app.js' %}"></script>
</body>
</html>
