name: Deploy to Production Server

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/enclass/app
            git config --global --add safe.directory /var/www/enclass/app
            git fetch origin production
            git checkout production
            git pull origin production

            /var/www/enclass/venv/bin/pip install -r requirements.txt

            run_django() {
              sudo -u enclass bash -c "set -a; . /etc/default/enclass; set +a; /var/www/enclass/venv/bin/python manage.py $*"
            }

            run_django migrate --noinput
            run_django collectstatic --noinput

            sudo systemctl restart enclass
            echo "Production deployment completed successfully!"