name: Deploy to Production Server

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          password: ${{ secrets.PROD_PASSWORD }}
          script: |
            cd /var/www/enclass/app
            git config --global --add safe.directory /var/www/enclass/app
            git fetch origin production
            git checkout production
            git pull origin production
            /var/www/enclass/venv/bin/pip install -r requirements.txt
            /var/www/enclass/venv/bin/python manage.py migrate
            /var/www/enclass/venv/bin/python manage.py collectstatic --noinput
            sudo systemctl restart enclass || systemctl restart enclass
            echo "Production deployment completed successfully!"
